aid: beeline
name: Beeline
description: >-
  Beeline makes smart navigation devices and a companion mobile app for cyclists
  and motorcyclists. Its compact handlebar-mounted devices — Beeline Velo for
  bicycles and Beeline Moto for motorcycles — use a simple directional and
  turn-by-turn interface to help riders find their way around towns and cities,
  discover better routes, and record their journeys. The London-based company is
  backed by Seedcamp. Beeline sells direct to consumers through a Shopify-hosted
  storefront at beeline.co, which exposes an agent-facing commerce surface — a
  Universal Commerce Protocol (UCP) MCP endpoint, Shopify customer-account OIDC,
  and an llms.txt agent policy — rather than a first-party developer product API.
